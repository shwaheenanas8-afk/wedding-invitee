<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Lateef&display=swap" rel="stylesheet">
<title>دعوة زفاف</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif;}
body{background-color: #f3f0af;}

/* HERO */
.hero {
  width: 100%;
  height: 100vh;
  background: url('c2d891c8-60fc-49ed-b551-bdb9afa12127.png') center top no-repeat;
  background-size: cover;
  position: relative;
  overflow: hidden;
}

/* overlay */
.overlay{
  position: absolute;
  bottom: 80px; /* حركنا الكل لينزل تحت الكلمة الخضراء */
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  width: 100%;
}

/* اسماء العروسين */
.names{
  font-size:50px;
  color:#8f0404;
  margin-bottom:10px;
  opacity:0;
  animation:fadeInNames 1s forwards 0.5s;
}
@keyframes fadeInNames{
  to{opacity:1;}
}

/* التاريخ والكلمة الجانبية */
.info-row{
  display:flex;
  justify-content: space-between;
  align-items: center;
  width: 80%;
  margin: 10px auto 20px auto;
  gap:20px;
  opacity:0;
  animation:fadeInInfo 1s forwards 0.7s;
}
.info-row .date{font-size:22px;color:#7c1414;}
.info-row .subtitle{font-size:18px;color:#721717;}
@keyframes fadeInInfo{
  to{opacity:1;}
}

/* كلمة "مرر للأسفل" والماوس */
.scroll-down{
  margin-top:20px;
  color:#7e1b1b;
  text-align:center;
  cursor:pointer;
}
.mouse{
  width:25px;
  height:40px;
  border:2px solid #722525;
  border-radius:30px;
  margin:auto;
  position:relative;
}
.wheel{
  width:4px;
  height:8px;
  background:#792929;
  position:absolute;
  top:6px;
  left:50%;
  transform:translateX(-50%);
  border-radius:2px;
  animation:scrollWheel 0.4s infinite;
}
@keyframes scrollWheel{
  0%{opacity:1; top:6px;}
  100%{opacity:0; top:20px;}
}

/* النصوص على الصورة */
.text-on-hero{
  text-align:center;
  margin-top:10px;
  opacity:0;
  animation:fadeInText 1s forwards 1s;
}
.text-on-hero b{
  display:block;
  font-family:'Lateef', cursive;
  font-size:24px;
  color:#8f0404;
  margin-bottom:10px;
}
@keyframes fadeInText{
  to{opacity:1;}
}

/* CARD */
.card{
  margin:20px;
  padding:20px;
  border-radius:20px;
  text-align:center;
  background:transparent;
}
.rings {
  width: 120px;
  height: 100px;
  margin: 0 auto 20px;
  position: relative;
  filter: sepia(1) saturate(8) hue-rotate(10deg) brightness(0.9) contrast(1.2);
}
.rings::after {
  content: "";
  position: absolute;
  top: 10%;
  left: 15%;
  width: 70%;
  height: 40%;
  background: linear-gradient(120deg, rgba(255,255,255,0.6), rgba(255,255,255,0));
  border-radius: 50%;
  pointer-events: none;
  mix-blend-mode: screen;
}
.time{font-size:20px;margin-bottom:5px;color:#7f8b46;}
.place{font-size:16px;color:#7f8b46;}
.note-children{
  color:#8f0404; 
  font-weight:bold; 
  text-align:center; 
  margin-top:10px; 
  font-size:14px;
}

/* MAP */
.map-title{margin-top:30px;color:#6f665d;}
.map{margin-top:15px;border-radius:20px;overflow:hidden;position:relative;}
.map iframe{width:100%;height:200px;border:0;border-radius:20px;}
.map a{position:absolute;top:0;left:0;width:100%;height:100%;z-index:5;}

/* COUNTDOWN */
.countdown-section{
  text-align:center;
  margin:50px 20px;
}
.countdown-section .count-title{
  color:#88060d;
  font-weight:bold;
  font-size:28px;
}
.countdown{
  display:flex;
  justify-content:center;
  gap:10px;
  font-size:16px;
  color:#88060d;
  flex-wrap:wrap;
}
.countdown div{
  padding:10px;
  border-radius:10px;
  min-width:60px;
  background:#fff;
}
.countdown div span{
  font-family:'Times New Roman', Times, serif;
  display:block;
  font-size:24px;
  font-weight:bold;
}

/* RSVP */
.rsvp{
  background-color:#FFFDD0;
  padding:40px 20px;
  text-align:center;
}
.rsvp h2{
  font-family:'Amiri', serif;
  font-size:32px;
  color:#7f8b46;
  margin-bottom:15px;
}
.rsvp h3{color:#7f8b46;}
.rsvp form{
  display:flex;
  flex-direction:column;
  gap:10px;
  max-width:300px;
  margin:auto;
}
input,select{padding:10px;border:none;border-radius:8px;}
button{padding:10px;border-radius:8px;border:none;cursor:pointer;}
#btnNo{background:#8d0202;color:#faf7f7;}
#btnYes{background:#7f8b46;color:#fff;}

/* FOOTER */
.footer{text-align:center;padding:30px 20px;}
.footer-text{font-family:'Amiri', serif;font-size:18px;color:#5a5a5a;margin-bottom:15px;}
.footer-names{font-family:'Playfair Display', serif;font-size:22px;color:#4a4a4a;letter-spacing:1px;}

/* RESPONSIVE */
@media (max-width:600px){
  .names{font-size:28px;}
  .date{font-size:18px;}
  .subtitle{font-size:16px;}
  .text-on-hero b{font-size:18px;}
  .time{font-size:18px;}
  .place{font-size:14px;}
  .scroll-down{margin-top:10px;}
  .info-row{flex-direction:column; gap:5px;}
}
</style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <div class="overlay">
    <h1 class="names">فارس 🕊️ العنود</h1>
    <div class="info-row">
      <div class="date">May 29, 2026</div>
      <div class="subtitle">انضموا الينا في يوم زفافنا</div>
    </div>
    <div class="text-on-hero">
      <b>دعوة زفاف</b>
      <b>ندعوكم لمشاركتنا اجمل لحظات العمر</b>
    </div>
    <div class="scroll-down" onclick="scrollDown()">
      <div class="mouse"><div class="wheel"></div></div>
      <span>مرر للأسفل</span>
    </div>
  </div>
</div>

<!-- باقي الصفحة مثل السابق (Card، Countdown، RSVP، Footer) -->
